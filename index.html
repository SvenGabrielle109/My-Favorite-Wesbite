<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Attendance Tracker</title>
    <py-config>
        packages = ['numpy', 'matplotlib']
    </py-config>

    <style>
       body {
           font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
           background-color: #d2bcff;
           margin: 0;
           padding: 20px;
       }

       .container{
           display: flex;
           flex-direction: column;
           align-items: center;
           background-color: #fed7ff;
           border-radius: 10px;
           padding: 20px;
       }

       h1, .container h2{
           color: #6368cf;
           font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
           text-align: center;
           font-weight: bolder;
       }
      
       input[type="button"] {
           background: linear-gradient(to right, red,yellow,green,blue);
           color: white;
           padding: 10px 20px;
           border: none;
           border-radius: 4px;
           cursor: pointer;
           font-size: 16px;
       }

       nav{
           background-color: #ffffff;
       }

        nav.navbar {
           background: linear-gradient(90deg, rgb(229, 176, 255), rgba(230, 180, 255, 0.809));
           padding: 0.5rem 1rem;
           border-radius: 12px;
           box-shadow: 0 8px 30px rgb(57, 9, 82);
           backdrop-filter: blur(6px);
       }

       .container-fluid {
           max-width: 1100px;
           margin: 0 auto;
       }

       .navbar-brand {
           color: #810b83f8;
           font-weight: 700;
           letter-spacing: 0.2px;
           font-size: 1.05rem;
           padding-left: 0.25rem;
       }
       .navbar-brand:hover {
           color: #810b83f8;
           text-decoration: none;
       }

       .navbar-nav .nav-link {
           color: #810b83f8;
           font-weight: 600;
           margin: 0 0.25rem;
           padding: 0.45rem 0.7rem;
           border-radius: 8px;
           transition: transform .18s ease, box-shadow .18s ease, color .18s ease;
           position: relative;
       }

       .navbar-nav .nav-link::after {
           content: "";
           position: absolute;
           left: 12%;
           right: 12%;
           bottom: 6px;
           height: 3px;
           background: transparent;
           border-radius: 3px;
           transition: width .18s ease, background .18s ease;
           width: 0%;
       }

       .navbar-nav .nav-link:hover {
           color: #fff;
           transform: translateY(-3px);
           border: 1px solid rgba(255, 255, 255, 0.12);
           background-image: linear-gradient(90deg,#febfff,#fd80ff);
           }

       .navbar-nav .nav-link:hover::after {
           width: 76%;
           background: rgba(255,255,255,0.18);
       }

       .navbar-nav .nav-link.active,
       .navbar-nav .nav-link[aria-current="page"] {
           color: #fff !important;
           background-image: linear-gradient(90deg,#febfff,#fd80ff);
           box-shadow: 0 8px 18px rgba(255,255,255,0.18);
       }

       .navbar-toggler {
           border: 1px solid rgba(255, 255, 255, 0.18);
           border-radius: 8px;
           padding: 0.25rem 0.45rem;
       }

       @media (max-width: 991px) {
           nav.navbar {
               padding: 0.4rem;
           }
           .navbar-nav {
               background: #4684ffc0;
               border-radius: 8px;
               padding: 0.5rem;
           }
       }
   </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Home Page</a>
            <button class="navbar-toggler" type="button" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
            </ul>
            </div>
        </div>
    </nav>

    <br>

    <main>
        <div class="container">
            <h1 class="text-center">My Favorite Things</h1>
            
        </div>
    </main>
</body>
</html>
